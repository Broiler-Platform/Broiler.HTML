name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Resolved preview version for a publish run
        type: string
        default: ''

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ inputs.package-version }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # The libraries are platform-neutral net10.0. The Win32 demo targets
        # net10.0-windows, which EnableWindowsTargeting lets the Ubuntu leg compile too.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test preview version selection
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Build
        run: |
          args=()
          if [ -n "$PACKAGE_VERSION" ]; then
            args+=("-p:Version=$PACKAGE_VERSION" "-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet build Broiler.HTML.slnx -c Release --nologo "${args[@]}"

      # tests/Broiler.HTML.Tests: the renderer's subresource loading against loopback
      # HTTP servers (cookies, CORS, redirects, cancellation). It needs no network beyond
      # 127.0.0.1 and ::1.
      - name: Test (.NET)
        run: dotnet test Broiler.HTML.slnx -c Release --no-build --nologo

      # The WPT and HTML 5.2 tooling and its corpus, none of which needs a renderer or
      # node_modules. The render/diff suites stay in the two workflow_dispatch workflows.
      - name: Test
        run: |
          npm test
          npm run html52:validate
          npm run html52:coverage -- --output "${RUNNER_TEMP}/html52-coverage" --fail-on-uncovered
          npm run html52:css-coverage:check
          npm run html52:css-registry:check
          npm run html52:dashboard:check

      - name: Pack and verify every package
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./eng/pack.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
