name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A later push on the same branch cancels the earlier run: what is checked does
# not change, only how many times an abandoned commit is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows only, and not for want of trying a cheaper runner.
    # Source/Broiler.HTML.slnx includes Broiler.Graphics.Direct2D and
    # Broiler.HTML.Graphics.Win32.Demo, both of which target net10.0-windows, so
    # there is no Linux leg of this solution to build.
    name: Build (Windows)
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      # One level only, and by name. Broiler.Layout, Broiler.CSS and Broiler.DOM are
      # submodules of this repository as of 2026-09-09; before that they were
      # expected as sibling directories that existed only inside the Broiler.Browser
      # aggregate, which is why this job could not compile.
      #
      # `recursive` is deliberately NOT used any more. Broiler.Media declares
      # Broiler.Graphics as a submodule of its own, and Broiler.CSS carries a nested
      # Broiler.DOM that the root properties in Directory.Build.props collapse away;
      # fetching either is at best wasted and at worst a second checkout of a kernel
      # this build is careful to have only one of. The two nested checkouts that are
      # genuinely needed are named in the next step.
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      # Broiler.Graphics.csproj needs Broiler.Media.Image, and
      # Broiler.Graphics.Direct2D needs Broiler.Input.Mouse. Both come from
      # Broiler.Graphics's own nested checkouts.
      - name: Check out the graphics submodule's own dependencies
        run: git -C Broiler.Graphics submodule update --init --depth 1 Broiler.Media Broiler.Input

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Build only. This repository has no xunit project: its suites are the
      # html52 and WPT corpora under scripts/ and tests/, which are driven by
      # the two workflow_dispatch workflows beside this one and are far too long
      # to run per pull request. Compiling the head is still worth gating — a
      # head that stops compiling is a defect a pull request introduced.
      - name: Build
        run: dotnet build Source/Broiler.HTML.slnx -c Release --nologo
